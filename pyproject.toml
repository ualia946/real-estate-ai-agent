[project]
name = "real-estate-ai-agent"
version = "0.1.0"
description = "AI Agent to analyze real estate opportunities"
requires-python = ">=3.10"

dependencies = [
    # Main dependencies will go here once we know what we use for Adapters
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest"
]
# Linter and Formatter Configuration (Ruff)
# Ruff is the modern industry standard, replacing Black, Flake8, and isort.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E: Style errors (PEP8)
# F: Fatal errors (unused variables, etc.)
# I: Isort (automatically sorts imports)
select = ["E", "F", "I"]
ignore = []

# Type Checker Configuration (Mypy)
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

# Testing Configuration (Pytest)
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
